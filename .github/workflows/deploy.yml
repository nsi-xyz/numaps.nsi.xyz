name: Déploiement Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy (Worker + D1)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Compilation du site
        run: npm run build

      - name: Application des migrations D1
        run: npx wrangler d1 execute numaps-nsi-xyz --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Déploiement du Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sonde post-déploiement
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' https://numaps.nsi.xyz/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Sonde OK (HTTP $code) :"; cat /tmp/health.json; echo
              if grep -q '"d1":"ok"' /tmp/health.json; then exit 0; fi
              echo "::error::La base D1 n'est pas joignable depuis le Worker."
              exit 1
            fi
            echo "Tentative $i : HTTP $code — nouvelle tentative dans 5s..."
            sleep 5
          done
          echo "::error::Le site ne répond pas correctement après déploiement."
          exit 1
