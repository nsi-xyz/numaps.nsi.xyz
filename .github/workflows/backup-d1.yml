name: Sauvegarde D1

# Sauvegarde quotidienne de la base D1.
#
# ⚠️ Les artefacts d'un dépôt PUBLIC sont téléchargeables par n'importe qui.
#    La sauvegarde est donc TOUJOURS chiffrée (AES-256) avec le secret
#    BACKUP_PASSPHRASE avant d'être archivée.
#
# 🔑 RESTAURATION :
#   1. Télécharger l'artefact depuis l'onglet « Actions ».
#   2. Déchiffrer :
#        openssl enc -d -aes-256-cbc -pbkdf2 \
#          -in d1-backup.sql.enc -out d1-backup.sql \
#          -pass env:BACKUP_PASSPHRASE
#   3. Appliquer :
#        npx wrangler d1 execute numaps-nsi-xyz --remote --file=d1-backup.sql
#
#    ⚠️ La passphrase vit dans `.secrets/env` (local, gitignoré) ET dans les secrets
#       GitHub. Sans elle, la sauvegarde est définitivement illisible : conserve-la
#       dans un gestionnaire de mots de passe.

on:
  schedule:
    # Tous les jours à 03:17 UTC (heure creuse).
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    name: Export chiffré de la base
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Export de la base
        run: npx wrangler d1 export numaps-nsi-xyz --remote --output="$RUNNER_TEMP/d1-backup.sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Vérification de l'export
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/d1-backup.sql" || { echo "::error::L'export est vide."; exit 1; }
          echo "Taille : $(wc -c < "$RUNNER_TEMP/d1-backup.sql") octets"
          echo "Tables : $(grep -c 'CREATE TABLE' "$RUNNER_TEMP/d1-backup.sql" || true)"
          # Un export sans aucune table est anormal.
          grep -q 'CREATE TABLE' "$RUNNER_TEMP/d1-backup.sql" || { echo "::error::Aucune table dans l'export."; exit 1; }

      - name: Chiffrement de la sauvegarde
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/d1-backup.sql" \
            -out "$RUNNER_TEMP/d1-backup.sql.enc" \
            -pass env:BACKUP_PASSPHRASE
          rm -f "$RUNNER_TEMP/d1-backup.sql"
          echo "Sauvegarde chiffrée : $(wc -c < "$RUNNER_TEMP/d1-backup.sql.enc") octets"
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: Archivage
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_number }}
          path: ${{ runner.temp }}/d1-backup.sql.enc
          retention-days: 90
          if-no-files-found: error
